<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Retroactive Salary Calculator</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; padding: 24px; background: #fff; color: #1a1a1a; max-width: 800px; margin: 0 auto; }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 24px; }
  .retro-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 1.5rem; }
  @media (max-width: 500px) { .retro-grid { grid-template-columns: 1fr; } }
  .retro-field { display: flex; flex-direction: column; gap: 6px; }
  .retro-field label { font-size: 13px; color: #666; }
  .retro-field input, .retro-field select { width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; background: #fff; color: #1a1a1a; }
  .metric-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 1.5rem; }
  .metric { background: #f5f5f5; border-radius: 8px; padding: 1rem; }
  .metric-label { font-size: 12px; color: #666; margin-bottom: 4px; }
  .metric-value { font-size: 22px; font-weight: 500; color: #1a1a1a; }
  .metric-sub { font-size: 12px; color: #888; margin-top: 2px; }
  .table-wrap { border: 1px solid #e5e5e5; border-radius: 8px; overflow: hidden; margin-bottom: 1rem; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
  th { background: #f5f5f5; color: #666; font-weight: 500; padding: 8px 12px; text-align: left; border-bottom: 1px solid #e5e5e5; }
  td { padding: 8px 12px; border-bottom: 1px solid #e5e5e5; color: #1a1a1a; }
  tr:last-child td { border-bottom: none; }
  .highlight td { background: #f5f5f5; font-weight: 500; }
  .section-title { font-size: 13px; font-weight: 600; color: #888; margin: 1.5rem 0 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; }
  .error { color: #888; font-size: 14px; padding: 1rem 0; display: none; }
</style>
</head>
<body>
<h1>Retroactive Salary Calculator</h1>

<div class="section-title">Pay details</div>
<div class="retro-grid">
  <div class="retro-field">
    <label>Pay type</label>
    <select id="payType">
      <option value="annual">Annual salary</option>
      <option value="hourly">Hourly wage</option>
    </select>
  </div>
  <div class="retro-field" id="hoursField" style="display:none;">
    <label>Hours per week</label>
    <input type="number" id="hoursPerWeek" value="40" min="1" max="168" step="1" />
  </div>
  <div class="retro-field">
    <label id="oldPayLabel">Old annual salary</label>
    <input type="number" id="oldPay" value="60000" min="0" step="1" />
  </div>
  <div class="retro-field">
    <label id="newPayLabel">New annual salary</label>
    <input type="number" id="newPay" value="65000" min="0" step="1" />
  </div>
</div>

<div class="section-title">Retroactive period</div>
<div class="retro-grid">
  <div class="retro-field">
    <label>Effective date (start of retro period)</label>
    <input type="date" id="effectiveDate" />
  </div>
  <div class="retro-field">
    <label>Payment date (end of retro period)</label>
    <input type="date" id="paymentDate" />
  </div>
  <div class="retro-field">
    <label>Pay frequency</label>
    <select id="payFreq">
      <option value="12" selected>Monthly (12/yr)</option>
      <option value="24">Semi-monthly (24/yr)</option>
    </select>
  </div>
</div>

<div id="results" style="display:none;">
  <div class="section-title">Summary</div>
  <div class="metric-grid">
    <div class="metric">
      <div class="metric-label">Total retroactive payment</div>
      <div class="metric-value" id="sumGross">—</div>
      <div class="metric-sub">gross amount owed</div>
    </div>
    <div class="metric">
      <div class="metric-label">Monthly gross retro amount</div>
      <div class="metric-value" id="sumMonthlyRetro">—</div>
      <div class="metric-sub">avg per month owed</div>
    </div>
  </div>

  <div class="section-title">Pay period breakdown</div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Period</th>
          <th>Old pay</th>
          <th>New pay</th>
          <th>Difference</th>
        </tr>
      </thead>
      <tbody id="breakdown"></tbody>
      <tfoot>
        <tr class="highlight">
          <td>Total</td>
          <td id="tOld">—</td>
          <td id="tNew">—</td>
          <td id="tDiff">—</td>
        </tr>
      </tfoot>
    </table>
  </div>
</div>

<div class="error" id="noResults">The effective date must be before the payment date.</div>

<script>
const fmtDec = v => v.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2});
const msPerDay = 86400000;

function setDefaults() {
  const today = new Date();
  const tomorrow = new Date(today);
  tomorrow.setDate(tomorrow.getDate() + 1);
  document.getElementById('effectiveDate').value = today.toISOString().slice(0,10);
  document.getElementById('paymentDate').value = tomorrow.toISOString().slice(0,10);
}

function getPayPerPeriod(payType, value, freq, hoursPerWeek) {
  if (payType === 'annual') return value / freq;
  return (value * hoursPerWeek * 52) / freq;
}

function daysBetween(a, b) {
  return Math.round((b - a) / msPerDay) + 1;
}

function getFullPeriodBounds(date, freq) {
  if (freq == 24) {
    const isFirstHalf = date.getDate() <= 15;
    const start = isFirstHalf
      ? new Date(date.getFullYear(), date.getMonth(), 1)
      : new Date(date.getFullYear(), date.getMonth(), 16);
    const end = isFirstHalf
      ? new Date(date.getFullYear(), date.getMonth(), 15)
      : new Date(date.getFullYear(), date.getMonth() + 1, 0);
    return { start, end };
  } else {
    const start = new Date(date.getFullYear(), date.getMonth(), 1);
    const end = new Date(date.getFullYear(), date.getMonth() + 1, 0);
    return { start, end };
  }
}

function getPeriodDates(startDate, endDate, freq) {
  const periods = [];
  let current = new Date(startDate);
  while (current <= endDate) {
    const bounds = getFullPeriodBounds(current, freq);
    const actualStart = current > bounds.start ? current : bounds.start;
    const actualEnd = bounds.end <= endDate ? bounds.end : endDate;
    const fullDays = daysBetween(bounds.start, bounds.end);
    const actualDays = daysBetween(actualStart, actualEnd);
    periods.push({ start: new Date(actualStart), end: new Date(actualEnd), fraction: actualDays / fullDays });
    current = new Date(bounds.end.getTime() + msPerDay);
  }
  return periods;
}

function calcMonthsSpanned(periods, freq) {
  if (freq == 24) {
    return periods.reduce((sum, p) => sum + p.fraction * 0.5, 0);
  } else {
    return periods.reduce((sum, p) => sum + p.fraction, 0);
  }
}

function dateStr(d) {
  return d.toLocaleDateString(undefined, {month:'short', day:'numeric', year:'numeric'});
}

function calculate() {
  const payType = document.getElementById('payType').value;
  const oldPay = parseFloat(document.getElementById('oldPay').value) || 0;
  const newPay = parseFloat(document.getElementById('newPay').value) || 0;
  const freq = parseInt(document.getElementById('payFreq').value);
  const hoursPerWeek = parseFloat(document.getElementById('hoursPerWeek').value) || 40;
  const effectiveDateVal = document.getElementById('effectiveDate').value;
  const paymentDateVal = document.getElementById('paymentDate').value;

  if (!effectiveDateVal || !paymentDateVal) return;
  const startDate = new Date(effectiveDateVal + 'T00:00:00');
  const endDate = new Date(paymentDateVal + 'T00:00:00');

  const resultsEl = document.getElementById('results');
  const noResultsEl = document.getElementById('noResults');

  if (startDate >= endDate) {
    resultsEl.style.display = 'none';
    noResultsEl.style.display = 'block';
    return;
  }
  noResultsEl.style.display = 'none';

  const oldPerPeriod = getPayPerPeriod(payType, oldPay, freq, hoursPerWeek);
  const newPerPeriod = getPayPerPeriod(payType, newPay, freq, hoursPerWeek);
  const periods = getPeriodDates(startDate, endDate, freq);

  let totalOld = 0, totalNew = 0, totalDiff = 0;
  const tbody = document.getElementById('breakdown');
  tbody.innerHTML = '';

  periods.forEach(p => {
    const old_ = oldPerPeriod * p.fraction;
    const new_ = newPerPeriod * p.fraction;
    const diff = new_ - old_;
    totalOld += old_; totalNew += new_; totalDiff += diff;
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${dateStr(p.start)} – ${dateStr(p.end)}</td><td>${fmtDec(old_)}</td><td>${fmtDec(new_)}</td><td style="color:#3a7d11">+${fmtDec(diff)}</td>`;
    tbody.appendChild(tr);
  });

  document.getElementById('tOld').textContent = fmtDec(totalOld);
  document.getElementById('tNew').textContent = fmtDec(totalNew);
  document.getElementById('tDiff').textContent = '+' + fmtDec(totalDiff);
  document.getElementById('sumGross').textContent = fmtDec(totalDiff);

  const monthsSpanned = calcMonthsSpanned(periods, freq);
  document.getElementById('sumMonthlyRetro').textContent = fmtDec(totalDiff / monthsSpanned);

  resultsEl.style.display = 'block';
}

document.getElementById('payType').addEventListener('change', function() {
  const isHourly = this.value === 'hourly';
  document.getElementById('hoursField').style.display = isHourly ? 'flex' : 'none';
  document.getElementById('oldPayLabel').textContent = isHourly ? 'Old hourly rate' : 'Old annual salary';
  document.getElementById('newPayLabel').textContent = isHourly ? 'New hourly rate' : 'New annual salary';
  document.getElementById('oldPay').value = isHourly ? 20 : 60000;
  document.getElementById('newPay').value = isHourly ? 22 : 65000;
  calculate();
});

['oldPay','newPay','payFreq','effectiveDate','paymentDate','hoursPerWeek'].forEach(id => {
  document.getElementById(id).addEventListener('input', calculate);
  document.getElementById(id).addEventListener('change', calculate);
});

setDefaults();
calculate();
</script>
</body>
</html>
